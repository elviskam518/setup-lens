name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run static fixture tests
        run: python -m unittest discover -s tests -v
      - name: Check distribution installation
        run: python -m pip install . --no-deps
      - name: Render demo without running it
        run: setuplens examples/atlas-demo --format html -o setup-report.html
